name: Importar sorteios da Quina

on:
  # A cada 30 minutos, todo dia. O script sai na hora quando não há sorteio
  # novo (barato), e assim o resultado entra no máximo ~30 min depois de a
  # Caixa publicar — sem depender de dia/horário fixo.
  schedule:
    - cron: '*/30 * * * *'
  # Botão "Run workflow" na aba Actions, para rodar na hora.
  workflow_dispatch:

# Nunca deixa dois runs ao mesmo tempo.
concurrency:
  group: importar-sorteios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Importar sorteios
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAIL_DESTINO: eltonluisoc@gmail.com
          MAX_CONCURSOS: '90'
        run: node scripts/importar-sorteios.mjs
