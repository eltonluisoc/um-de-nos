<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Um de Nós - Super Quina 17</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAZdEVYdFNvZnR3YXJlAHBhaW50Lm5ldCA0LjAuMTM0A1t6AAAAHUlEQVRYCe3UsQkAIAwFQbv/cUcwsCAzg2SSd3fgvzcCCxGGA0C1nL4AAAAASUVORK5CYII=">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E7D32">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 UM DE NÓS</h1>
            <h2>Super Quina 17</h2>
            <p>Quem acertar 17 números primeiro vence!</p>
        </header>

        <div class="status-jogo" id="statusJogo">
            <span class="status-badge">🟢 JOGO EM ANDAMENTO</span>
        </div>

        <div class="ultimo-sorteio" id="ultimoSorteio">
            <h3>📢 Último sorteio da Quina</h3>
            <div class="numeros-sorteio" id="numerosSorteio">-</div>
        </div>

        <div class="placar">
            <h3>🏆 RANKING DE ACERTOS</h3>
            <div class="tabela-placar">
                <div class="cabecalho">
                    <span>Pos</span>
                    <span>Participante</span>
                    <span>Acertos</span>
                    <span>Progresso</span>
                </div>
                <div id="listaParticipantes">
                    <div class="loading">Carregando participantes...</div>
                </div>
            </div>
        </div>

        <div class="vencedor-info" id="vencedorInfo" style="display:none;">
            <div class="vencedor-card">
                <h3>🏆 VENCEDOR 🏆</h3>
                <p id="vencedorNome"></p>
                <p id="vencedorData"></p>
            </div>
        </div>

        <footer>
            <p>Sorteios oficiais da Quina • Atualização em tempo real</p>
        </footer>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="public.js"></script>
    <script>
    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/um-de-nos/sw.js')
            .then(registration => {
                console.log('Service Worker registrado com sucesso:', registration);
            })
            .catch(error => {
                console.log('Falha ao registrar Service Worker:', error);
            });
    }
</script>

                })

                    console.log('Falha ao registrar Service Worker:', error);
                });
        }
    </script>
</body>
</html>
